name: CI

# Guards the build. Nothing deploys automatically -- Cloudflare Pages is not
# connected to this repo yet, and when it is, deploying stays a deliberate act.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mbd.ast

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mbd.ast/package-lock.json

      - name: Install
        run: npm ci

      - name: Content invariants
        # Catches the things that fail silently rather than at build time:
        # a bare URL, a second H1, a month heading that is not a month, a
        # stray <br> or tab, an unreadable artwork cache.
        run: node scripts/check-content.mjs

      - name: Types
        run: npm run check

      - name: Build
        run: npm run build

      - name: Confirm entries still render as rows
        # A row count of zero means the rehype pass silently stopped matching,
        # which would otherwise ship a site of plain prose. Slugs come from the
        # content directory rather than a glob over dist, so the lab and test
        # pages at the site root do not get counted as broken posts.
        #
        # Thresholds are measured, not guessed (GOTCHAS.md section 2). Measured
        # per page on 2026-10-12: 2017=21 2018=13 2019=65 2020=77 2021=61
        # 2022=93 2023=53 2024=99 2025=45 2026=20 to-do=331, total 878.
        # Content only ever grows, so TOTAL_FLOOR exists to catch loss, not
        # growth. A move between pages does not change the total; only a real
        # deletion does, and every To-Do removal is a ledger row in
        # TO-DO-REMOVALS.md -- so if this trips, check that file before raising
        # the number. The old floor of 700 was written against a miscount of
        # 2532 and would have passed the loss of 178 rows.
        run: |
          total=0
          failed=0
          for md in src/content/blog/*.md; do
            # Astro slugifies, so To-Do.md becomes to-do. The runner's
            # filesystem is case sensitive and will not paper over this.
            slug=$(basename "$md" .md | tr '[:upper:]' '[:lower:]')
            page="dist/$slug/index.html"
            if [ ! -f "$page" ]; then
              echo "  $slug: MISSING at $page" >&2
              failed=1
              continue
            fi
            # Exact class, with quotes. `class="mbd-row"` unquoted also matches
            # mbd-rows and mbd-row__thumb and reported 2532 for 796 rows.
            count=$(grep -o 'class="mbd-row"' "$page" | wc -l)
            echo "  $slug: $count"
            total=$((total + count))
            if [ "$count" -lt 5 ]; then
              echo "  $slug rendered $count release rows" >&2
              failed=1
            fi
          done
          echo "total release rows: $total"
          if [ "$failed" -ne 0 ] || [ "$total" -lt 850 ]; then
            echo "row rendering looks broken" >&2
            exit 1
          fi

      - name: No stray files in the build output
        # Astro copies public/ verbatim, so anything sitting there is served at
        # the site root. A .gitignore entry does not help: gitignore governs what
        # is committed, not what Astro copies. This repo picked up a 6 KB
        # .DS_Store from the template that way and shipped it on every build.
        run: |
          strays=$(find dist -name '.*' -type f -not -name '.nojekyll' || true)
          if [ -n "$strays" ]; then
            echo "these files would be published at the site root:" >&2
            echo "$strays" >&2
            exit 1
          fi
          echo "dist is clean"